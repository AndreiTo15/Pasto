<style>

main{padding:4px 14px 40px;max-width:600px;margin:auto}

.meal.done{opacity:.55;padding:10px 14px;align-items:center}
.meal.done .items,.meal.done .note,.meal.done details{display:none}

.meal.done .name{color:var(--muted);text-decoration:line-through}
.meal.done .chk{margin-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:#fff;font-size:17px;padding:0;margin-top:1px}
.done .chk{background:var(--green);border-color:var(--green)}
.body{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--green)}
.kcal{font-size:12px;color:var(--muted);white-space:nowrap}
.items{list-style:none;margin:8px 0 0;padding:0;font-size:17px;line-height:1.35;font-weight:500}
.items li{padding:3px 0}
.note{margin-top:8px;font-size:13px;background:var(--warn);color:var(--warnink);border-radius:10px;padding:7px 10px;font-weight:600}

summary{font-size:14px;font-weight:700;color:var(--green);cursor:pointer;padding:4px 0;list-style:none}

summary::before{content:"⇄ "}
.alt{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--muted);white-space:pre-line}
.free{border-style:dashed}
.cond{background:var(--mint);border-color:transparent}
main{padding-bottom:110px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}

.nav .on{background:var(--mint);color:var(--green)}

.head{padding:16px 6px 2px}.head h1{font-size:34px;font-weight:700;letter-spacing:-.8px}.head span{font-size:15px}

.wadd button{background:var(--green);border-radius:12px;font-weight:600}
.wbig{border:0;border-radius:16px}
.wrow,.srow{border-bottom:.5px solid var(--line)}
.glist{background:var(--card);border-radius:14px;padding:0 16px;overflow:hidden}
.glist .srow:last-child{border-bottom:0}
.sgrp{margin:22px 16px 6px;font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted)}
.srow.on{opacity:.4}
</style>
</head>
